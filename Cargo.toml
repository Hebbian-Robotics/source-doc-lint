[package]
name = "source-doc-lint"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Configurable source comment and documentation linter"
repository = "https://github.com/Hebbian-Robotics/source-doc-lint"

[dependencies]
anyhow = "1.0.104"
ast-grep-core = "=0.40.5"
ast-grep-language = "=0.40.5"
clap = { version = "4.6.8", features = ["derive"] }
globset = "0.4.21"
ignore = "0.4.34"
regex = "1.13.2"
rustpython-ast = { version = "0.4", default-features = false, features = ["visitor", "num-bigint"] }
rustpython-parser = { version = "0.4", default-features = false, features = ["num-bigint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
