name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: true
          key: check-${{ matrix.os }}
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +stable test --locked --all-features
      - name: Check dependency policy
        if: runner.os == 'Linux'
        run: |
          cargo +stable install cargo-machete --version 0.9.2 --locked
          cargo +stable install cargo-deny --version 0.20.2 --locked
          cargo +stable machete --with-metadata --skip-target-dir
          cargo +stable deny check bans
