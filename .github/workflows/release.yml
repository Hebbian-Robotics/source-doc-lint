name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo +stable test --locked --all-features --target ${{ matrix.target }}
      - run: cargo +stable build --locked --release --target ${{ matrix.target }}
      - name: Package binary and license
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p package
          cp LICENSE package/
          binary=source-doc-lint
          if [[ "$TARGET" == *windows* ]]; then binary=source-doc-lint.exe; fi
          cp "target/$TARGET/release/$binary" package/
          tar -czf "source-doc-lint-$TARGET.tar.gz" -C package "$binary" LICENSE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-doc-lint-${{ matrix.target }}
          path: source-doc-lint-${{ matrix.target }}.tar.gz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef3501313 # v7.0.0
        with:
          pattern: source-doc-lint-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum source-doc-lint-*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes source-doc-lint-*.tar.gz SHA256SUMS
